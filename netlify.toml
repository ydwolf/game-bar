# Plain static site served as-is. build.sh only stamps the live commit into version.json for
# the footer. (The site now deploys on Cloudflare Pages; this file keeps Netlify working too.)
[build]
  publish = "."
  command = "sh build.sh"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
