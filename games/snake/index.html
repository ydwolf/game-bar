<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#3d2616">
  <title>Snake · The Game Bar</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐍</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rye&family=Special+Elite&family=Zilla+Slab:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/western.css">
</head>
<body style="--accent: var(--sage)">
  <nav class="topbar"><a class="back-link" href="../../index.html">← Back to the saloon</a></nav>

  <header class="game-heading">
    <p class="kicker">Arrow keys</p>
    <h1>Snake</h1>
  </header>

  <main class="stage has-pad">
    <div class="hud">
      <div class="hud-item"><span class="hud-label">Pears</span><span class="hud-value" id="score">0</span></div>
      <div class="hud-item"><span class="hud-label">Best</span><span class="hud-value" id="best">0</span></div>
    </div>

    <div class="screen" style="--w: 480px; --aspect: 1">
      <canvas id="game" width="480" height="480" aria-label="Snake game board"></canvas>
      <div class="overlay" id="overlay"><h2>Snake</h2><p></p></div>
    </div>

    <div class="touch-pad" aria-hidden="true">
      <div class="dpad">
        <button class="pad-btn" data-key="ArrowUp">▲</button>
        <button class="pad-btn" data-key="ArrowLeft">◀</button>
        <button class="pad-btn" data-key="ArrowRight">▶</button>
        <button class="pad-btn" data-key="ArrowDown">▼</button>
      </div>
    </div>

    <p class="controls">
      <span class="kbd-only">Arrow keys or WASD to steer · Space to pause</span>
      <span class="touch-only">Swipe the board or use the pad to steer · Tap the board to pause</span>
    </p>
  </main>

  <script src="../../js/arcade.js"></script>
  <script src="snake.js"></script>
</body>
</html>
