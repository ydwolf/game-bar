<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#3d2616">
  <title>Minesweeper · The Game Bar</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧨</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rye&family=Special+Elite&family=Zilla+Slab:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/western.css">
  <link rel="stylesheet" href="minesweeper.css">
</head>
<body style="--accent: var(--turquoise)">
  <nav class="topbar"><a class="back-link" href="../../index.html">← Back to the saloon</a></nav>

  <header class="game-heading">
    <p class="kicker">Click + flag</p>
    <h1>Minesweeper</h1>
  </header>

  <main class="stage">
    <div class="hud">
      <div class="hud-item"><span class="hud-label">Dynamite</span><span class="hud-value" id="mines-left">6</span></div>
      <button id="reset" class="hud-item face-btn" title="New game" aria-label="New game">🤠</button>
      <div class="hud-item"><span class="hud-label">Time</span><span class="hud-value" id="timer">0</span></div>
      <div class="hud-item"><span class="hud-label">Best</span><span class="hud-value" id="best">—</span></div>
    </div>

    <div class="screen" style="--w: 420px; --aspect: 1">
      <div id="board" class="mine-board" role="grid" aria-label="Minesweeper board"></div>
    </div>

    <button id="mode" class="mode-toggle" aria-pressed="false">⛏️ Dig mode</button>

    <p id="message" class="mine-message">Pick any tile to start.</p>
    <p class="controls">
      <span class="kbd-only">Left-click to dig · Right-click to flag dynamite</span>
      <span class="touch-only">Tap to dig · Long-press or switch to Flag mode to flag dynamite</span>
    </p>
  </main>

  <script src="../../js/arcade.js"></script>
  <script src="minesweeper.js"></script>
</body>
</html>
